# Collaudo del modulo CIE e build dell'APK di prova dell'app companion Android.
name: Prototipo Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  modulo-cie:
    name: Test del modulo CIE (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test
        working-directory: cie-core
        run: gradle test
      - name: Report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-test-modulo-cie
          path: cie-core/build/reports/tests/test

  app-android:
    name: Build APK di prova
    runs-on: ubuntu-latest
    needs: modulo-cie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
      - name: Analisi e test Dart
        working-directory: companion
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build APK debug
        working-directory: companion
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=BUILD_ID=build-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: cie-sign-companion-debug-apk
          path: companion/build/app/outputs/flutter-apk/app-debug.apk
