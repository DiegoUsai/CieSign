# Collaudo del motore di firma e del protocollo, build dell'app desktop per
# Windows (prima piattaforma) e macOS.
name: App desktop

on:
  push:
    branches: [main, "claude/**"]
    paths: ["desktop/**", "packages/**", "tools/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "packages/**", "tools/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  test:
    name: Test e conformità delle firme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Motore di firma (ciesign_ades)
        working-directory: packages/ciesign_ades
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Protocollo PC-telefono (ciesign_link)
        working-directory: packages/ciesign_link
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Collegamento WebRTC (ciesign_webrtc)
        working-directory: packages/ciesign_webrtc
        run: |
          flutter pub get
          flutter analyze --fatal-infos
      - name: App desktop
        working-directory: desktop
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validazione con EU DSS dei file firmati dai test
        working-directory: tools/dss-validator
        run: mvn -q -B compile exec:java -Dexec.args="../../packages/ciesign_ades/test/resources/titolare-test.der $(ls ../../packages/ciesign_ades/build/test-output/* | tr '\n' ' ')"
      - name: File firmati di esempio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-firmati-di-prova
          path: packages/ciesign_ades/build/test-output

  signaling:
    name: Servizi di signaling (Firebase e Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dipendenze
        run: |
          (cd packages/ciesign_link && dart pub get)
          (cd tools/signaling-worker && npm ci)
          npm i -g firebase-tools@14
      - name: Emulatori di Firebase con le regole vere
        working-directory: tools/signaling-firebase
        run: firebase emulators:exec --only auth,database --project demo-ciesign "cd ../../packages/ciesign_link && dart test -t servizio"
      - name: Worker di Cloudflare in locale
        run: |
          (cd tools/signaling-worker && npx wrangler dev --port 8787 --ip 127.0.0.1 > ../../wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/v1/ice.json && break; sleep 1; done
          cd packages/ciesign_link && CIESIGN_TEST_SIGNALING_URL=http://127.0.0.1:8787 dart test -t servizio

  windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: desktop
        run: |
          flutter pub get
          flutter build windows --release --dart-define=CIESIGN_SIGNALING_URL=${{ vars.CIESIGN_SIGNALING_URL }} --dart-define=CIESIGN_FIREBASE_API_KEY=${{ vars.CIESIGN_FIREBASE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cie-sign-windows
          path: desktop/build/windows/x64/runner/Release

  macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: desktop
        run: |
          flutter pub get
          flutter build macos --release --dart-define=CIESIGN_SIGNALING_URL=${{ vars.CIESIGN_SIGNALING_URL }} --dart-define=CIESIGN_FIREBASE_API_KEY=${{ vars.CIESIGN_FIREBASE_API_KEY }}
      - name: Archivio dell'app
        run: ditto -c -k --keepParent "desktop/build/macos/Build/Products/Release/cie_sign_desktop.app" cie-sign-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cie-sign-macos
          path: cie-sign-macos.zip
